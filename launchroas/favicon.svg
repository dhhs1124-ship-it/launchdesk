<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
<!-- 사이드바 로고마크(index.html .logo-mark, 2x2 사각형 그리드)를 그대로 재사용 —
     원본은 outline(stroke) 아이콘이라 16px 파비콘에서는 선이 사라지므로, 같은
     그리드 구조를 채운(fill) 사각형으로 바꿔 작은 크기에서도 보이게 했다. -->
<rect width="32" height="32" rx="4" fill="#FFFFFF"/>
<rect x="6" y="6" width="8" height="8" rx="1.5" fill="#111111"/>
<rect x="18" y="6" width="8" height="8" rx="1.5" fill="#111111"/>
<rect x="6" y="18" width="8" height="8" rx="1.5" fill="#111111"/>
<rect x="18" y="18" width="8" height="8" rx="1.5" fill="#111111"/>
</svg>
